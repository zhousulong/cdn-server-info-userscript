name: Validate

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check userscript syntax
              run: node --check cdn-server-info.user.js

            - name: Check release version consistency
              run: npm run release:check

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Check formatting
              run: npm run format:check
